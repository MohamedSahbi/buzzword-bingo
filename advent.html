<style>
  :root{--night:#0d2236;--night2:#143552;--fir:#0f5132;--berry:#b3261e;--gold:#f2b84b;--snow:#f7fbff;--ink:#132433;--muted:#5a6b7b;--card:#ffffff;--line:#d8e2ea}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--snow);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 50% -10%,#1d4a70 0%,var(--night2) 40%,var(--night) 100%);overflow-x:hidden}
  .snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .snow i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.75;animation:fall linear infinite}
  @keyframes fall{to{transform:translate3d(var(--dx),105vh,0)}}
  @media (prefers-reduced-motion:reduce){.snow{display:none}}
  .shell{position:relative;z-index:1;max-width:1100px;margin:auto;padding:20px}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  header a{color:#cfe3f5;text-decoration:none;font-size:14px}
  h1{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:clamp(28px,5vw,44px);margin:0;letter-spacing:.01em}
  h1 span{color:var(--gold)}
  .grow{flex:1}
  .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #ffffff33;background:#ffffff14;color:var(--snow);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
  select.pill{appearance:auto}
  select.pill option{color:#111}
  .banner .ic{font-size:18px;margin-right:2px}.banner .ic+span{flex:1 1 0;min-width:170px}.banner .cd{font-variant-numeric:tabular-nums;font-weight:800;color:var(--gold)}
  .banner{background:#ffffff14;border:1px solid #ffffff2a;border-radius:14px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
  .doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
  .door{position:relative;aspect-ratio:1/1.08;border-radius:14px;border:0;cursor:pointer;color:#fff;font:inherit;overflow:hidden;box-shadow:0 6px 18px #0006;transition:transform .15s}
  .door:hover:not(:disabled){transform:translateY(-3px) rotate(-.5deg)}
  .door:disabled{cursor:default}
  .door.p0{background:repeating-linear-gradient(45deg,#b3261e 0 14px,#c8392f 14px 28px)}
  .door.p1{background:repeating-linear-gradient(-45deg,#0f5132 0 12px,#176b44 12px 24px)}
  .door.p2{background:radial-gradient(#ffffff2e 2px,transparent 2.5px) 0 0/16px 16px,#1f4f8a}
  .door.p3{background:repeating-linear-gradient(90deg,#7a2f8f 0 10px,#8d3ea3 10px 20px)}
  .door.p4{background:repeating-linear-gradient(0deg,#ffffff22 0 3px,transparent 3px 18px),repeating-linear-gradient(90deg,#ffffff22 0 3px,transparent 3px 18px),#9b1c1c}
  .door.p5{background:radial-gradient(#f2b84b 2px,transparent 2.5px) 0 0/14px 14px,#0b4a3a}
  .door.p6{background:repeating-linear-gradient(45deg,#c62828 0 10px,#fbeeee 10px 20px)}
  .door.p7{background:radial-gradient(#ffffff70 2px,transparent 2.5px) 0 0/12px 12px,#b8862a}
  .door.p8{background:radial-gradient(#ffffff66 3px,transparent 3.5px) 0 0/22px 22px,radial-gradient(#ffffff40 1.5px,transparent 2px) 11px 11px/22px 22px,#2c5d8f}
  .door.p9{background:repeating-linear-gradient(135deg,#0e6e75 0 8px,#12828a 8px 16px)}
  .door.big{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
  .door.big .num{width:76px;height:76px;font-size:34px}
  .door .bow{position:absolute;z-index:3;font-size:26px;left:50%;top:-4px;transform:translateX(-50%)}
  .door::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:var(--rib,var(--gold));opacity:.92}
  .door::after{content:"";position:absolute;top:50%;left:0;right:0;height:12px;margin-top:-6px;background:var(--rib,var(--gold));opacity:.92}
  .door .num{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:var(--snow);color:var(--berry);display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:24px;box-shadow:0 2px 6px #0004}
  .door .lab{position:absolute;z-index:2;left:6px;right:6px;bottom:6px;text-align:center;font-size:11px;font-weight:700;background:#0008;border-radius:8px;padding:3px 4px}
  .door .tag{position:absolute;z-index:2;top:6px;right:6px;font-size:16px}
  .door.locked{filter:grayscale(.75) brightness(.7)}
  .door.today{outline:3px solid var(--gold);animation:glow 1.8s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 0 22px var(--gold)}}
  .door.done .num{background:var(--gold);color:#3a2500}
  .side{display:flex;flex-direction:column;gap:14px}
  .panel{background:var(--card);color:var(--ink);border-radius:16px;padding:16px;box-shadow:0 10px 30px #0005}
  .panel h2{margin:0 0 8px;font-size:17px;font-family:Georgia,serif}
  .muted{color:var(--muted);font-size:13px;margin:0}
  .field{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .field label{font-size:12px;font-weight:700;color:var(--muted)}
  input,select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font:inherit;color:var(--ink);background:#fbfdff;width:100%}
  .btn{border:1px solid var(--line);background:#f4f7fa;color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--berry);border-color:var(--berry);color:#fff}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#3a2500}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .board{list-style:none;margin:8px 0 0;padding:0}
  .board li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
  .board li.me{font-weight:700}
  .err{color:var(--berry);font-size:13px;min-height:18px;margin:6px 0 0}
  .hidden{display:none!important}
  /* play view */
  .play{background:var(--card);color:var(--ink);border-radius:18px;padding:18px;box-shadow:0 10px 30px #0005}
  .play h2{font-family:Georgia,serif;margin:0;font-size:24px}
  .unlock{display:block;width:100%;margin:12px 0 4px;font-size:16px;padding:12px;animation:pop .4s ease}
  .remind{display:flex;align-items:center;gap:12px;margin:12px 0;padding:12px 14px;border-radius:14px;background:#fff7e3;border:1px solid #f2d48b;color:#3a2500;text-align:left}.remind .ic{font-size:24px}.remind b{display:block}.remind .grow{flex:1}.ok-txt{color:#0f5132}
  .ios-steps{list-style:none;padding:0;margin:12px 0;display:grid;gap:10px}.ios-steps li{display:flex;gap:10px;align-items:center}.ios-steps li span:first-child{font-size:20px}
  .angel-entry{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#ffffff1f,#b3261e40);border:1px solid #ffffff2a;border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:14px}
  .angel-entry .ic{font-size:28px;line-height:1}.angel-entry b{display:block;font-size:15px}.angel-entry .grow{flex:1}
  .angel-rules{display:flex;gap:10px;margin:12px 0;font-weight:800}.angel-rules span{flex:1;text-align:center;padding:10px;border-radius:12px;background:#eef6ff}.angel-rules span+span{background:#fde8e6}
  .angel-top{display:flex;gap:12px;align-items:center;font-weight:700;color:var(--muted)}.angel-top b{margin-left:auto;font-size:26px;color:var(--ink);font-family:Georgia,serif}
  .angel-bar{position:relative;height:26px;background:#e6edf3;border-radius:9px;overflow:hidden;margin:8px 0 14px}.angel-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#f2b84b,#ffd98a)}
  .angel-bar b{position:absolute;right:10px;top:0;line-height:26px;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
  .angel-card{position:relative}.angel-float{position:absolute;right:14px;top:10px;font-size:22px;font-weight:900;color:#0f5132;animation:floatUp .9s ease-out forwards;pointer-events:none}.angel-float.neg{color:#b3261e}
  @keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
  #aScore.bump{animation:bump .35s ease}@keyframes bump{50%{transform:scale(1.25)}}#aScore{display:inline-block;font-variant-numeric:tabular-nums}
  .angel-card{min-height:120px;display:grid;place-items:center;text-align:center;font-size:20px;font-weight:800;padding:18px;border-radius:16px;background:#fbf7ef;border:2px solid var(--line);touch-action:pan-y;user-select:none}
  .angel-card small{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}
  .angel-card.in{animation:pop .25s ease}.angel-card.ok{border-color:#2e9d62;background:#ecf8f1}.angel-card.no{border-color:var(--berry);background:#fdeceb}
  @keyframes pop{from{transform:scale(.94);opacity:.4}}
  .angel-btns{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  .angel-pick{border:0;border-radius:16px;padding:14px;font-size:34px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:inherit}
  .angel-pick span{font-size:15px;font-weight:800}.angel-pick.a{background:#e3f0ff;color:#123}.angel-pick.d{background:#fde0dc;color:#4a0f0a}.angel-pick:active{transform:scale(.97)}
  #aShareBox .sharebar{justify-content:center}
  .angel-keys{direction:ltr;unicode-bidi:isolate;text-align:center;font-size:12px}.angel-diff{list-style:none;padding:0;margin:0;display:grid;gap:6px}.angel-diff li{background:#f4f7fa;border-radius:10px;padding:8px 10px;font-size:14px}.angel-diff li span{font-weight:800;margin-right:6px}
  .kind{display:inline-block;font-size:12px;font-weight:700;background:#fde9c4;color:#6b4300;border-radius:999px;padding:3px 10px;margin-bottom:6px}
  .split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;margin-top:12px}
  .feed{height:360px;overflow-y:auto;background:#eef3f7;border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
  .msg{max-width:90%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:7px 11px;font-size:14px}
  .msg b{display:block;font-size:11px;color:var(--muted)}
  .msg{position:relative}.msg time{float:right;margin:4px 0 0 10px;font-size:10px;color:var(--muted)}
  .msg.emo{font-size:30px;background:transparent;border:0;padding:2px 6px}
  .msg.voice .wave{letter-spacing:1px;color:#2e9d62}.msg.photo .ph{display:block;width:150px;height:90px;border-radius:10px;background:#dfe8ef;display:grid;place-items:center;font-size:36px}
  .msg.deleted{font-style:italic;color:var(--muted)}
  .msg .react{position:absolute;right:-6px;bottom:-10px;background:#fff;border:1px solid var(--line);border-radius:999px;font-size:12px;padding:0 5px}
  .typing{font-size:12px;color:var(--muted);padding:2px 6px}.typing i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--muted);margin:0 1px;animation:dot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes dot{50%{opacity:.2;transform:translateY(-2px)}}
  .bd{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px}.bd td{padding:3px 0;border-bottom:1px dashed #e9d39c}.bd td:last-child{text-align:right;font-weight:700}.bd tr.tot td{border:0;font-size:16px}
  .cap{font-size:16px;line-height:1.5;padding:4px 6px;border-radius:8px}
  .cap.now{background:#fff4d6}
  .riddle{align-self:center;text-align:center;margin:auto;font-size:64px;line-height:1.1}
  .riddle small{display:block;font-size:13px;color:var(--muted);margin-top:8px}
  .past{font-size:13px;color:var(--muted);text-align:center}
  .cardwrap{position:relative;min-width:0}.card{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .pts-float{position:absolute;transform:translate(-50%,-10%);font-weight:900;font-size:22px;color:#0f5132;text-align:center;pointer-events:none;white-space:nowrap;animation:ptsUp 1.1s ease-out forwards;text-shadow:0 2px 0 #fff,0 0 8px #fff;z-index:3}
  .pts-float small{display:block;font-size:12px;font-weight:800;color:#5a6b7b}
  @keyframes ptsUp{from{opacity:1;transform:translate(-50%,-10%) scale(1.1)}to{opacity:0;transform:translate(-50%,-120%) scale(1)}}
  .sq{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:#fbfdff;color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;line-height:1.15;padding:4px;cursor:pointer;overflow:hidden}
  .sq.ok{background:#c9efd9;border-color:#2e9d62;color:#0c3d22}
  .sq.bad{background:#f7c9c5}
  .sq.star{border:2px solid var(--gold);background:#fff6df}
  .sq.star.ok{background:#f7d985}
  .stats{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
  .gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding:8px 10px;background:#fff;border:1px solid var(--line);border-radius:14px;z-index:5}
  .gbar .stat{padding:4px 10px}.gbar .stat b{font-size:18px}.gbar .toggle{font-size:13px}
  .live{width:12px;height:12px;border-radius:50%;background:#c9d6e3;flex:none}.live.on{background:#d63a2f;box-shadow:0 0 0 0 #d63a2f88;animation:pulse 1.4s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 10px #d63a2f00}100%{box-shadow:0 0 0 0 #d63a2f00}}
  .go-big{margin:auto;border:0;border-radius:20px;background:var(--berry);color:#fff;font:inherit;font-size:22px;font-weight:900;padding:18px 34px;cursor:pointer;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px #b3261e55}
  .go-big span{font-size:26px}.go-big:hover{filter:brightness(1.08)}
  .stat{background:#eef3f7;border-radius:10px;padding:6px 12px}
  .stat small{display:block;font-size:11px;color:var(--muted)}
  .stat b{font-size:20px}
  .note{font-size:13px;color:var(--muted);min-height:20px;margin:8px 0 0}
  .result{margin-top:14px;padding:14px;border-radius:14px;background:#fff6df;border:1px solid #f2d08a}
  .result pre{white-space:pre-wrap;background:#fff;border-radius:10px;padding:10px;font-size:13px;margin:8px 0}
  .boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
  .box{min-height:96px;border-radius:12px;border:2px dashed #b9c7d3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;position:relative;color:var(--muted);font-size:26px;overflow:hidden}
  .box.done{border:0;color:var(--fg)}
  .box.done::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:var(--rib)}
  .box.done::after{content:"";position:absolute;top:50%;left:0;right:0;height:10px;margin-top:-5px;background:var(--rib)}
  .box .tagx{position:relative;z-index:1;background:#fff;color:var(--ink);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;margin-bottom:4px}
  .box .inx{position:relative;z-index:1;font-size:11px;line-height:1.3;background:#ffffffcc;border-radius:6px;padding:2px 4px}
  .items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
  .item{min-height:54px;border-radius:10px;border:1px solid var(--line);background:#fbfdff;color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:4px;transition:transform .12s}
  .item.sel{background:#c9efd9;border-color:#2e9d62;transform:translateY(-3px)}
  .shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .toggle{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
  .toggle input{width:auto}
  /* magic effect for bonuses */
  .spark{position:fixed;z-index:60;pointer-events:none;font-size:var(--sz,18px);left:var(--x);top:var(--y);animation:burst var(--d,900ms) cubic-bezier(.15,.7,.3,1) forwards}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(.3) rotate(0);opacity:1}80%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot));opacity:0}}
  .glow{animation:glowpop .9s ease-out}
  @keyframes glowpop{0%{box-shadow:0 0 0 0 #f2b84bcc;transform:scale(1)}30%{box-shadow:0 0 0 10px #f2b84b66;transform:scale(1.06)}100%{box-shadow:0 0 0 22px #f2b84b00;transform:scale(1)}}
  .flash{position:fixed;inset:0;z-index:55;pointer-events:none;background:radial-gradient(circle at var(--x) var(--y),#f2b84b55,transparent 60%);animation:fl .8s ease-out forwards}
  @keyframes fl{to{opacity:0}}
  @media (prefers-reduced-motion:reduce){.spark,.flash{display:none}.glow{animation:none}}
  .menu-btn,.m-only,.tabbar{display:none}.hdr-actions{display:flex;gap:8px;align-items:center}
  .loading{display:none}body.is-loading .loading{display:grid;place-items:center;font-size:42px;height:40vh;animation:spin 2.4s linear infinite}
  body.is-loading #calendarView,body.is-loading #banner,body.is-loading #teamPanel,body.is-loading .tabbar,body.is-loading .hdr-actions,body.is-loading #menuBtn{visibility:hidden}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sq{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:normal}
  /* ---------- phones: app bar + ☰ menu + bottom tabs ---------- */
  @media (max-width:720px){
    body{padding-bottom:78px}.shell{padding:0 10px 12px}
    .appbar{position:sticky;top:0;z-index:30;margin:0 -10px 8px;padding:10px 12px;background:#0d2236e8;backdrop-filter:blur(6px);border-bottom:1px solid #ffffff1f;flex-wrap:nowrap}
    .menu-btn{display:inline-flex;font-size:18px;padding:6px 12px}
    .hdr-actions{display:none}
    .hdr-actions.open{display:flex;position:absolute;top:56px;inset-inline-end:10px;flex-direction:column;align-items:stretch;background:var(--night2);border:1px solid #ffffff2a;border-radius:16px;padding:10px;box-shadow:0 18px 40px #0007;min-width:230px}
    .hdr-actions.open .pill{width:100%;justify-content:flex-start;padding:10px 12px;font-size:15px}.hdr-actions.open .m-only{display:inline-flex}
    h1{font-size:28px}#subtitle{font-size:13px;margin-bottom:10px!important}
    .tabbar{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0d2236f2;backdrop-filter:blur(6px);border-top:1px solid #ffffff1f;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
    .tabbar button{border:0;background:transparent;color:#cfe3f5;font:inherit;font-size:12px;font-weight:700;padding:6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
    .tabbar button.on{background:#ffffff1a;color:var(--gold)}
    body.playing .tabbar{display:none}body.playing{padding-bottom:12px}
    body[data-tab=cal] .side{display:none}
    body[data-tab=score] #calendarView>section,body[data-tab=score] #banner{display:none}
  }
  @media (max-width:860px){
    /* Phones: chat (left) and card (right) side by side, filling the screen; the card stays 4×4 so lines still mean bingo. */
    .bingo-door h2{font-size:19px;margin:4px 0}.bingo-door > p.muted{font-size:13px;margin:4px 0 0!important}.bingo-door.running > p.muted,.bingo-door.running > .note{display:none}

<script type="module">
  import { ADVENT_UI } from './advent/ui.js';
  import * as ADVENT_INDEX from './advent/index.js';
  const { CALENDARS } = ADVENT_INDEX;
  // A cached older module may lack SEASON_CODES for a few minutes after a deploy.
  const SEASON_CODES = ADVENT_INDEX.SEASON_CODES || ['en', 'cs'];
  import { firebaseConfig, vapidKey } from './firebase-config.js';
  import { needsInstall, pushSupported, isSubscribed, isBlocked, subscribe, updatePrefs } from './push.js';
  import { mountPredict } from './advent/predict.js';
  import { PREDICT_IDEAS } from './advent/predict-ideas.js';
  import { LANGUAGES, translate } from './languages/index.js';
  import { mountAngel } from './advent/angel.js';
  import { shareBar } from './share.js';
  import { canFullscreen, toggleFullscreen, exitFullscreen } from './fullscreen.js';
  import { deedsFor } from './advent/deeds/index.js';

  // ---------- setup ----------
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  // Two modes: the real season calendar (published from the private content repo to Firebase, each door
  // readable only from its release time) and the open practice calendar (public content in advent/*.js).
  const DB = firebaseConfig.databaseURL;
  let metas = {};                       // season calendars published for this year, by culture code
  const known = c => (CALENDARS[c] || metas[c] ? c : null);
  let cal = 'en';          // calendar culture (which doors)
  let uiLang = 'en';       // website language (all interface text), shared with the main page
  let preview = params.get('preview') === '1';   // practice mode
  // Practice calendars exist per culture; a regional code without its own (en-US) uses its base language's (en).
  const C = () => (!preview && metas[cal]) ? metas[cal] : CALENDARS[cal] || CALENDARS[String(cal).split('-')[0]] || CALENDARS.en;
  const seasonMode = () => !preview && !!metas[cal];
  const uiOf = c => ADVENT_UI[c] || ADVENT_UI[String(c).split('-')[0]] || ADVENT_UI.en;
  const t = (k, v = {}) => (uiOf(uiLang)[k] ?? ADVENT_UI.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? '');
  const esc = s => String(s).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));

  // Season: December of this year (or of last year while it's January).
  const now = () => new Date();
  const seasonYear = (() => { const d = now(); return d.getMonth() === 0 ? d.getFullYear() - 1 : d.getFullYear(); })();
  const doorDate = n => { const [m, d] = C().dates[n]; return new Date(m === 1 ? seasonYear + 1 : seasonYear, m - 1, d); };
  const releaseAt = n => seasonMode() ? C().release[n] : doorDate(n).getTime();
  const unlocked = n => !seasonMode() || Date.now() >= releaseAt(n);
  const isToday = n => seasonMode() && Date.now() >= releaseAt(n) && Date.now() < releaseAt(n) + 864e5;
  const fmtDate = n => seasonMode()
    ? `${new Date(releaseAt(n)).toLocaleDateString(C().locale, { day: 'numeric', month: 'long', timeZone: C().timezone })}, 00:00 ${C().tzLabel}`
    : doorDate(n).toLocaleDateString(C().locale, { day: 'numeric', month: 'long' });
  const doorType = n => seasonMode() ? C().types[n] : C().doors[n].type;
  // Firebase turns {1:…,24:…} into an array with an empty slot 0, so list only real doors.
  const doorNums = () => Object.entries(C().dates).filter(([, v]) => v).map(([k]) => Number(k)).sort((a, b) => a - b);

  // A released door is fetched once with a plain web request and kept in this browser.
  async function loadDoor(n) {
    if (!seasonMode()) return structuredClone(C().doors[n]);
    const key = `bingoAdventDoor:${cal}:${seasonYear}:${n}`;
    try { const c = JSON.parse(localStorage.getItem(key)); if (c) return c; } catch {}
    const r = await fetch(`${DB}/advent/${cal}/${seasonYear}/doors/${n}.json`);
    const d = r.ok ? await r.json() : null;
    if (!d) throw new Error('locked');
    localStorage.setItem(key, JSON.stringify(d));
    return d;
  }
  async function loadMetas() {
    const codes = [...new Set([...Object.keys(CALENDARS), ...SEASON_CODES])];
    await Promise.all(codes.map(async c => { try { const r = await fetch(`${DB}/advent/${c}/${seasonYear}/meta.json`); const m = r.ok ? await r.json() : null; if (m?.release) metas[c] = m; } catch {} }));
  }

  // ---------- scores (browser) ----------
  const scoreKey = () => `bingoAdventSeason:${cal}:${seasonYear}`;
  const loadScores = () => { try { return JSON.parse(localStorage.getItem(scoreKey())) || {} } catch { return {} } };
  const saveScore = (n, pts, onDay) => { const s = loadScores(); if (s[n]) return false; s[n] = { pts, onDay, at: Date.now() }; localStorage.setItem(scoreKey(), JSON.stringify(s)); return true; };

  // ---------- sound ----------
  let soundOn = localStorage.getItem('bingoSound') !== 'off', actx = null;
  function tone(f, d, delay = 0, type = 'triangle', vol = 0.12) { if (!soundOn) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const at = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + d); o.connect(g).connect(actx.destination); o.start(at); o.stop(at + d + 0.02); } catch {} }
  const sfx = { ok: () => tone(660, .09), bad: () => tone(200, .12, 0, 'sawtooth', .06), star: () => [880, 1175].forEach((f, i) => tone(f, .14, i * .08, 'sine', .1)), bingo: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, i * .11, 'square', .08)), bell: () => [1319, 1568, 1319].forEach((f, i) => tone(f, .25, i * .18, 'sine', .07)), msg: () => tone(990, .04, 0, 'sine', .04) };
  function syncSound() { $('soundBtn').textContent = (soundOn ? '🔊 ' : '🔇 ') + t('sound'); }

  // ---------- magic effect: sparkles + golden glow when a bonus lands ----------
  function magic(el, big = false) {
    if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, icons = big ? ['✨', '⭐', '🌟', '🎉', '❄️', '🎁'] : ['✨', '⭐', '🌟'];
    el.classList.remove('glow'); void el.offsetWidth; el.classList.add('glow');
    if (big) { const f = document.createElement('div'); f.className = 'flash'; f.style.setProperty('--x', x + 'px'); f.style.setProperty('--y', y + 'px'); document.body.appendChild(f); setTimeout(() => f.remove(), 900); }
    for (let i = 0, N = big ? 40 : 16; i < N; i++) {
      const s = document.createElement('span'), a = Math.random() * Math.PI * 2, dist = (big ? 120 : 60) + Math.random() * (big ? 200 : 70);
      s.className = 'spark'; s.textContent = icons[i % icons.length];
      s.style.cssText = `--x:${x}px;--y:${y}px;--dx:${Math.cos(a) * dist}px;--dy:${Math.sin(a) * dist}px;--rot:${Math.random() * 360 - 180}deg;--sz:${(big ? 16 : 12) + Math.random() * 14}px;--d:${700 + Math.random() * 600}ms`;
      document.body.appendChild(s); setTimeout(() => s.remove(), 1400);
    }
  }

  // Shrink text in a square until its longest word fits (no mid-word breaks).
  const _m = document.createElement('canvas').getContext('2d');
  // Phones: the split (chat | card) takes exactly the screen height left below it, so all 16 squares stay visible.
  function fitGame() {
    const sp = document.querySelector('.bingo-door .split'); if (!sp) return;
    const land = matchMedia('(orientation:landscape) and (max-height:560px)').matches;
    if (land || matchMedia('(max-width:860px)').matches) {
      const below = land ? 8 : 10;
      sp.style.setProperty('--fitH', Math.max(land ? 200 : 330, window.innerHeight - sp.getBoundingClientRect().top - below) + 'px');
    }
    const c = sp.querySelector('.card'); if (c) fitSquares(c);
  }
  addEventListener('resize', () => requestAnimationFrame(fitGame));
  document.addEventListener('fullscreenchange', () => setTimeout(fitGame, 200));
  function fitSquares(root) {
    root.querySelectorAll('.sq').forEach(el => {
      el.style.fontSize = ''; const cs = getComputedStyle(el); let size = parseFloat(cs.fontSize); const max = el.clientWidth - 8;
      const widest = s => { _m.font = `${cs.fontWeight} ${s}px ${cs.fontFamily}`; return Math.max(...el.textContent.split(/\s+/).map(w => _m.measureText(w).width)); };
      const min = 9;
      while (size > min && widest(size) > max) { size -= 0.5; el.style.fontSize = size + 'px'; }
    });
  }
  // ---------- snow ----------
  for (let i = 0; i < 45; i++) { const f = document.createElement('i'); const s = 3 + Math.random() * 5; f.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;--dx:${(Math.random() * 80 - 40).toFixed(0)}px;animation-duration:${(8 + Math.random() * 10).toFixed(1)}s;animation-delay:-${(Math.random() * 18).toFixed(1)}s`; $('snow').appendChild(f); }

  // ---------- calendar view ----------
  const PAPER = ['p0', 'p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8', 'p9'];
  const RIBBON = ['#f2b84b', '#ffffff', '#d63a2f', '#2e9d62', '#c9d6e3', '#f2b84b'];
  function renderAll() {
    document.documentElement.lang = C().locale || cal; document.documentElement.dir = uiLang === 'ar' ? 'rtl' : 'ltr';
    document.title = `${t('title')} · Buzzword Bingo`;
    $('backLink').textContent = t('back'); $('langBtnText').textContent = LANGUAGES[uiLang]?.label || uiLang;
    $('title').innerHTML = `🎄 <span>${esc(t('title'))}</span>`;
    $('subtitle').textContent = C().tagline;
    $('navCal').textContent = t('nav_cal'); $('navScore').textContent = t('nav_score'); menuBtn.setAttribute('aria-label', t('menu')); $('practiceBtn').textContent = '🎯 ' + (preview ? t('previewExit') : t('previewBtn')); $('practiceBtn').classList.toggle('hidden', !metas[cal]);
    syncSound(); renderRemindMenu(); renderBanner(); tickCountdown(); renderAngelEntry(); renderDoors(); renderSolo(); renderTeamStatic(); renderTeam();
  }
  function renderBanner() {
    const b = $('banner'); b.classList.add('hidden');
    if (preview || !metas[cal]) {
      b.innerHTML = `<span class="ic">🎯</span><span>${esc(t('previewOn').split(/(?<=[.!?。])\s*/)[0])}</span>${metas[cal] ? `<button class="pill" id="exitPreview">${esc(t('previewExit'))}</button>` : ''}`; b.classList.remove('hidden');
      if (metas[cal]) $('exitPreview').onclick = () => { preview = false; history.replaceState(null, '', location.pathname); renderAll(); };
    }
    else if (predictDoor() && Date.now() >= releaseAt(predictDoor()) - 5 * 864e5 && Date.now() < releaseAt(predictDoor()) + 864e5) {
      const pn = predictDoor(); b.innerHTML = `<span class="ic">⭐</span><span>${esc(t('p_banner', { date: fmtDate(pn) }))}</span><button class="pill" id="goPredict">🔮 ${esc(t('p_create'))}</button>`; b.classList.remove('hidden');
      $('goPredict').onclick = () => openPredict(pn);

      const { D, db, uid } = await firebase(); const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let code;
      do { code = [...crypto.getRandomValues(new Uint32Array(6))].map(x => chars[x % chars.length]).join(''); } while ((await D.get(D.ref(db, `teams/${code}/meta`))).exists());
      const last = Math.max(...doorNums().map(releaseAt));
      await D.set(D.ref(db, `teams/${code}/meta`), { name: ($('tName').value || t('teamPh')).trim().slice(0, 30), lang: cal, createdBy: uid, createdAt: Date.now(), expiresAt: Math.min(last + 14 * 864e5, Date.now() + 59 * 864e5) });
      await connectTeam(code);
    } catch (e) { teamError(e); }
  };
  $('joinTeam').onclick = async () => {
    $('teamErr').textContent = ''; const code = cleanCode($('tCode').value); if (code.length !== 6) return;
    try { const { D, db } = await firebase(); if (!(await D.get(D.ref(db, `teams/${code}/meta`))).exists()) { $('teamErr').textContent = t('teamNotFound'); return; } await connectTeam(code); } catch (e) { teamError(e); }
  };
  $('leaveTeam').onclick = async () => { try { const { D, db, uid } = await firebase(); await D.remove(D.ref(db, `teams/${team.code}/members/${uid}`)); } catch {} teamUnsub?.(); team = null; localStorage.removeItem(teamKey()); renderTeam(); };
  $('copyTeam').onclick = async () => { const u = new URL(location.origin + location.pathname); u.searchParams.set('team', team.code); u.searchParams.set('lang', cal); try { await navigator.clipboard.writeText(u.href); $('copyTeam').textContent = t('copied'); setTimeout(() => $('copyTeam').textContent = t('copyLink'), 1500); } catch {} };
  $('tCode').oninput = e => e.target.value = cleanCode(e.target.value);

  // ---------- phones: ☰ menu, bottom tabs ----------
  const menuBtn = $('menuBtn'), hdr = $('hdrActions');
  function setMenu(open) { hdr.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', String(open)); menuBtn.textContent = open ? '✕' : '☰'; }
  menuBtn.onclick = e => { e.stopPropagation(); setMenu(!hdr.classList.contains('open')); };
  document.addEventListener('click', e => { if (hdr.classList.contains('open') && !hdr.contains(e.target)) setMenu(false); });
  function setTab(tab) { document.body.dataset.tab = tab; document.querySelectorAll('#tabbar [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab)); window.scrollTo({ top: 0 }); }
  document.querySelectorAll('#tabbar [data-tab]').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $('practiceBtn').onclick = () => { setMenu(false); preview = !preview; const u = new URL(location.href); preview ? u.searchParams.set('preview', '1') : u.searchParams.delete('preview'); history.replaceState(null, '', u); closeDoor(); renderAll(); };
  setTab('cal');

  // ---------- start ----------
  document.body.classList.add('is-loading');
  await loadMetas();
  document.body.classList.remove('is-loading');
  // One language model for the whole site (same as the main page):
  //   bingoSiteLang = interface text;  bingoCardLang = 'auto' (same as website) or a code for cards / the calendar.
  // A ?lang= invite link picks the calendar for this visit only and never overwrites the player's settings.
  const uiKnown = c => c && ADVENT_UI[c] ? c : (c && ADVENT_UI[String(c).split('-')[0]] ? String(c).split('-')[0] : null);
  if (!localStorage.getItem('bingoCardLang') && known(localStorage.getItem('bingoAdventLang'))) localStorage.setItem('bingoCardLang', localStorage.getItem('bingoAdventLang'));
  localStorage.removeItem('bingoAdventLang');
  const readSite = () => uiKnown(localStorage.getItem('bingoSiteLang')) || uiKnown(params.get('lang')) || uiKnown(navigator.language) || 'en';
  const readPref = () => localStorage.getItem('bingoCardLang') || 'auto';
  // 'auto' follows the website language, preferring the browser's own region (en + en-US browser → US calendar).
  const cultureFor = (site, pref) => pref !== 'auto' ? (known(pref) || known(site) || 'en')
    : ((String(navigator.language).split('-')[0] === site && known(navigator.language)) || known(site) || 'en');
  let invite = known(params.get('lang'));
  uiLang = readSite(); localStorage.setItem('bingoSiteLang', uiLang);
  cal = invite || cultureFor(uiLang, readPref());
  const allCodes = [...new Set([...Object.keys(metas), ...Object.keys(CALENDARS)])];
  function fillLangModal() {
    $('langTitle').textContent = translate(uiLang, 'settings.title'); $('siteLangLabel').textContent = translate(uiLang, 'settings.site');
    $('cardLangLabel').textContent = translate(uiLang, 'settings.cards'); $('langDone').textContent = translate(uiLang, 'settings.done');
    $('siteLang').innerHTML = Object.keys(LANGUAGES).filter(k => ADVENT_UI[k]).map(k => `<option value="${k}">${esc(LANGUAGES[k].label)}</option>`).join('');
    $('cardLang').innerHTML = `<option value="auto">${esc(translate(uiLang, 'settings.same', { lang: LANGUAGES[uiLang]?.label || uiLang }))}</option>` + allCodes.map(k => `<option value="${k}">${esc((metas[k] || CALENDARS[k]).label)}</option>`).join('');
    $('siteLang').value = uiLang; const pref = readPref(); $('cardLang').value = pref !== 'auto' && known(pref) ? known(pref) : 'auto';
  }
  $('iosOk').onclick = () => $('iosSheet').classList.remove('show');
  $('iosSheet').onclick = e => { if (e.target.id === 'iosSheet') $('iosSheet').classList.remove('show'); };
  $('langBtn').onclick = () => { fillLangModal(); $('langModal').classList.add('show'); };
  $('siteLang').onchange = () => { const keep = $('cardLang').value; uiLang = $('siteLang').value; fillLangModal(); $('siteLang').value = uiLang; $('cardLang').value = keep; };
  $('langModal').onclick = e => { if (e.target.id === 'langModal') $('langModal').classList.remove('show'); };
  $('langDone').onclick = () => {
    uiLang = $('siteLang').value; const pref = $('cardLang').value;
    localStorage.setItem('bingoSiteLang', uiLang); localStorage.setItem('bingoCardLang', pref);
    invite = null; const next = cultureFor(uiLang, pref); $('langModal').classList.remove('show');
    if (next !== cal) { cal = next; closeDoor(); } renderAll();
    if (isSubscribed()) firebase().then(f => updatePrefs({ ...f, prefs: pushPrefs() })).catch(() => {});
  };
  // Changed on the main page (other tab, or this page restored with the back button): follow it.
  const syncLang = () => {
    const site = readSite(), next = invite || cultureFor(site, readPref());
    if (site === uiLang && next === cal) return;
    uiLang = site; if (next !== cal) { cal = next; closeDoor(); } renderAll();
  };
  addEventListener('storage', e => { if (e.key === 'bingoSiteLang' || e.key === 'bingoCardLang') syncLang(); }); addEventListener('pageshow', syncLang); document.addEventListener('visibilitychange', () => { if (!document.hidden) syncLang(); });
  $('soundBtn').onclick = () => { soundOn = !soundOn; localStorage.setItem('bingoSound', soundOn ? 'on' : 'off'); syncSound(); if (soundOn) sfx.ok(); };
  renderAll();
  // Live invite link: join the room, then open its door (the room decides the calendar for this visit).
  const liveParam = cleanCode(params.get('live'));
  if (liveParam) joinLive(liveParam).then(() => {
    const go = () => { if (!live?.meta) return false; onLive = null; if (live.meta.cal !== cal && known(live.meta.cal)) { cal = live.meta.cal; renderAll(); } openDoor(live.meta.door); return true; };
    if (!go()) onLive = () => { go(); };
  }).catch(e => alert(e.message));
  const predictLink = cleanCode(params.get('predict'));
  if (predictLink && predictDoor()) openPredict(predictDoor(), null, predictLink);
  const invited = cleanCode(params.get('team')), saved = localStorage.getItem(teamKey());
  if (invited) { $('tCode').value = invited; $('teamPanel').scrollIntoView({ behavior: 'smooth' }); }
  else if (saved) connectTeam(saved).catch(teamError);
</script>
</body>
