    .hero{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:-6px 0 18px;padding:14px 18px;border-radius:16px;background:linear-gradient(100deg,#eaf2ff,#f6f9fc);border:1px solid var(--line)}

<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><div class="logo">▦</div><div><h1>Buzzword Bingo</h1><p class="sub" data-i18n="sub"></p></div></div>
      <button id="menuBtn" class="pill icon-btn menu-btn" type="button" aria-expanded="false" data-i18n-aria="menu.open">☰</button>
      <div class="top-actions" id="topActions">
        <button id="langBtn" class="pill lang-btn" type="button" data-i18n-title="settings.open" data-i18n-aria="settings.open">🌐 <span id="langBtnText"></span></button>
        <a id="adventLink" class="pill icon-btn" href="advent.html" style="text-decoration:none">🎄 <span data-i18n="advent.open"></span></a>
        <button id="soundBtn" class="pill icon-btn" type="button"></button>
        <button id="bossBtn" class="pill icon-btn" type="button" data-i18n-title="boss.open" data-i18n-aria="boss.open">📊 <span class="m-label" data-i18n="boss.open"></span></button>
        <button id="fsBtn" class="pill icon-btn hidden" type="button" data-i18n-title="fullscreen" data-i18n-aria="fullscreen">⛶ <span class="m-label" data-i18n="fullscreen"></span></button>
        <button id="printMenu" class="pill icon-btn m-only" type="button">🖨️ <span data-i18n="print"></span></button>
        <div class="pill conn-pill"><span id="connectionDot" class="dot"></span><span id="connectionText"></span></div>
      </div>
    </header>

    <!-- One-line premise and the two ways to play (plus the Advent calendar in season). -->
    <section class="hero" id="hero"><p class="premise" data-i18n="hero.premise"></p>
      <div class="hero-actions"><button id="heroSolo" class="btn primary" type="button">🎯 <span data-i18n="hero.solo"></span></button>
        <button id="heroTeam" class="btn" type="button">👥 <span data-i18n="nav.play"></span></button>
        <a id="heroAdvent" class="btn advent hidden" href="advent.html">🎄 <span data-i18n="advent.open"></span></a></div></section>

    <div class="layout">
      <section class="panel game" id="paneCard">
        <div class="toolbar">
          <div class="field"><label for="topic" data-i18n="topic"></label><select id="topic"></select></div>
          <button id="newCard" class="btn"></button>
          <button id="resetMarks" class="btn" data-i18n="resetMarks"></button>
          <button id="print" class="btn right" data-i18n="print"></button>
        </div>
        <div id="roomBanner" class="room-banner"><div><span class="mini" data-i18n="roomCodeLabel"></span><br><span id="roomCode" class="room-code"></span></div><div><strong id="roomMode"></strong><br><span id="roomHost" class="mini"></span></div><button id="copyInvite" class="btn small primary" data-i18n="copyInvite"></button></div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
        <div class="letters" aria-hidden="true"><span>B</span><span>I</span><span>N</span><span>G</span><span>O</span></div>
        <div id="board" class="board"></div>
        <div id="win" class="win" role="alert" data-i18n="win"></div>
        <div id="winShare"></div>
      </section>

      <aside class="side">
        <section class="panel" id="panePlay">
          <div class="tabs"><button id="soloTab" class="tab active" data-i18n="solo"></button><button id="multiTab" class="tab" data-i18n="multi"></button></div>
          <div id="soloControls" class="stack"><p class="help" data-i18n="soloHelp"></p><button id="startSolo" class="btn primary" data-i18n="startSolo"></button></div>
          <div id="multiControls" class="stack hidden">
            <div class="field"><label for="playerName" data-i18n="yourName"></label><input id="playerName" maxlength="24" autocomplete="nickname" data-i18n-ph="namePh"></div>
            <button id="openCreate" class="btn primary" data-i18n="createRoom"></button>
            <div class="divider"></div>
            <div class="field"><label for="joinCode" data-i18n="roomCode"></label><input id="joinCode" maxlength="6" autocomplete="off" placeholder="ABC234" dir="ltr" style="text-transform:uppercase"></div>
            <button id="joinRoom" class="btn" data-i18n="joinRoom"></button>
            <button id="leaveRoom" class="btn hidden" data-i18n="leaveRoom"></button>
            <button id="endRoom" class="btn danger hidden" data-i18n="endRoom"></button>
            <p id="firebaseNotice" class="notice hidden" data-i18n="fbNotice"></p>
          </div>
        </section>

        <section class="panel" id="panePlayers">
          <h2><span data-i18n="players"></span> <span id="playerCount" class="mini"></span></h2>
          <div id="players" class="players"></div>
        </section>

        <section class="panel" id="paneActivity">
          <h2 data-i18n="activity"></h2>
          <div id="feed" class="feed"></div>
          <details><summary data-i18n="how"></summary><ol class="steps help"><li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li><li data-i18n="how4"></li><li data-i18n="how5"></li></ol></details>
        </section>
      </aside>
    </div>

    <button type="button" data-tab="activity">💬 <span data-i18n="nav.activity"></span><i class="badge" id="actBadge"></i></button>
  </nav>

  <div id="createModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="createTitle">
    <div class="modal-card"><h2 id="createTitle" data-i18n="createTitle"></h2><div class="stack">

      <div class="field"><label for="createTopic" data-i18n="topic"></label><select id="createTopic"></select></div>
      <div class="field"><label for="createMode" data-i18n="gameMode"></label><select id="createMode"><option value="shared" data-i18n="modeShared"></option><option value="individual" data-i18n="modeIndividual"></option></select></div>
      <p class="help" data-i18n="createHelp"></p>
    </div><div class="modal-actions"><button id="cancelCreate" class="btn" data-i18n="cancel"></button><button id="createRoom" class="btn primary" data-i18n="createRoom"></button></div></div>
  </div>

      <div class="field"><label for="cardLang" data-i18n="settings.cards"></label><select id="cardLang"></select></div>
      <p id="langRoomNote" class="help hidden" data-i18n="settings.roomNote"></p>
    </div><div class="modal-actions"><button id="langDone" class="btn primary" data-i18n="settings.done"></button></div></div>
  </div>

  <div id="hostModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="hostModalTitle">
    <div class="modal-card"><h2 id="hostModalTitle"></h2><div id="hostModalBody" class="stack"></div><div id="hostModalActions" class="modal-actions"></div></div>
  </div>

  <div id="boss" class="boss" aria-hidden="true"><div class="boss-bar"><b id="bossFile"></b><span class="boss-menu"><span>File</span><span>Edit</span><span>View</span><span>Insert</span><span>Format</span><span>Data</span></span></div><div class="boss-fx">fx&nbsp;&nbsp;=SUM(B2:B8)</div><div class="boss-grid" id="bossGrid"></div><div class="boss-hint" id="bossHint"></div></div>

<script type="module">
  import { firebaseConfig } from './firebase-config.js';
  import { LANGUAGES, TOPIC_KEYS, translate, topicData, detectLanguage } from './languages/index.js';
  import { shareBar } from './share.js';

  import { getDatabase, ref, get, set, update, remove, onValue, onDisconnect, push, runTransaction, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

  const $ = id => document.getElementById(id);
  const els = ['topic','newCard','resetMarks','print','board','win','status','soloTab','multiTab','soloControls','multiControls','playerName','openCreate','joinCode','joinRoom','leaveRoom','endRoom','players','playerCount','feed','roomBanner','roomCode','roomMode','roomHost','copyInvite','createModal','createTopic','createLang','createMode','cancelCreate','createRoom','startSolo','connectionDot','connectionText','firebaseNotice','hostModal','hostModalTitle','hostModalBody','hostModalActions','langBtn','langBtnText','langModal','siteLang','cardLang','langRoomNote','langDone','soundBtn','bossBtn','boss','bossFile','bossGrid','bossHint'].reduce((o,id)=>(o[id]=$(id),o),{});
  const configured = firebaseConfig.apiKey && !firebaseConfig.apiKey.includes('REPLACE_ME');
  let app, auth, db, uid = null, roomCode = null, room = null, unsubscribers = [], soloBoard = [], soloMarks = {}, soloSeed = Date.now().toString();
  // Room lifecycle: hosts can end or hand over a room; if the host is away for HOST_GRACE_MS the
  // longest-present online player takes over. meta/lastActive feeds the nightly idle-room cleanup.
  const HOST_GRACE_MS = 2 * 60 * 1000, TOUCH_EVERY_MS = 60 * 1000;
  let hostTimer = null, lastTouch = 0, claimingHost = false, endedByMe = false;

  function touchRoom(force=false){ if(!roomCode||!db)return; const n=Date.now(); if(!force&&n-lastTouch<TOUCH_EVERY_MS)return; lastTouch=n; update(ref(db,`rooms/${roomCode}/meta`),{lastActive:serverTimestamp()}).catch(()=>{}) }

  // ---- Host dialogs: end room, hand over, auto-takeover ----
  function closeModal(){ els.hostModal.classList.remove('show') }
  function para(text){ const p=document.createElement('p');p.className='help';p.textContent=text;return p }
  function openModal(title,body,actions){
    els.hostModalTitle.textContent=title; els.hostModalBody.replaceChildren(...body);
    els.hostModalActions.replaceChildren(...actions.map(([label,cls,fn])=>{const b=document.createElement('button');b.type='button';b.className=`btn ${cls}`.trim();b.textContent=label;b.addEventListener('click',async()=>{b.disabled=true;try{await fn()}finally{b.disabled=false}});return b}));
    els.hostModal.classList.add('show');
  }
  // Other players, online first, then whoever joined earliest.
  function otherPlayers(){ return Object.entries(room?.players||{}).filter(([id,p])=>id!==uid&&p?.name).sort((a,b)=>((b[1].online!==false)-(a[1].online!==false))||((a[1].joinedAt||0)-(b[1].joinedAt||0))) }
  function openEndRoom(){ openModal(t('m.endTitle'),[para(t('m.endBody'))],[[t('cancel'),'',closeModal],[t('m.endBtn'),'danger',endRoom]]) }
  async function endRoom(){ if(!room||room.meta.hostId!==uid)return; endedByMe=true; try{await remove(ref(db,`rooms/${roomCode}`));closeModal()}catch(e){endedByMe=false;showError(e)} }
  function openLeave(){
    if(!room||room.meta.hostId!==uid){leaveRoom(true);return}
    const others=otherPlayers();
    if(!others.length){ openModal(t('m.leaveTitle'),[para(t('m.alone'))],[[t('cancel'),'',closeModal],[t('m.justLeave'),'',()=>leaveRoom(true)],[t('m.endBtn'),'danger',endRoom]]); return }
    const field=document.createElement('div');field.className='field';const label=document.createElement('label');label.htmlFor='handoverTo';label.textContent=t('m.handTo');const sel=document.createElement('select');sel.id='handoverTo';
    others.forEach(([id,p])=>{const o=document.createElement('option');o.value=id;o.textContent=`${p.name}${p.online===false?t('m.awaySuffix'):''}`;sel.append(o)}); field.append(label,sel);
    openModal(t('m.hostTitle'),[para(t('m.hostBody')),field],[[t('cancel'),'',closeModal],[t('endRoom'),'danger',endRoom],[t('m.handLeave'),'primary',()=>handOver(sel.value)]]);
  }
  async function handOver(toId){
    const p=room?.players?.[toId]; if(!p?.name||room.meta.hostId!==uid)return;
    try{ await update(ref(db,`rooms/${roomCode}/meta`),{hostId:toId,hostName:p.name}); await addActivity('act.handed',{name:cleanName(),to:p.name}); await leaveRoom(true) }catch(e){showError(e)}
  }
  // If the host left without handing over, or has been away for HOST_GRACE_MS, the online player who
  // joined first takes over. The database rules enforce the same condition, so races are harmless.
  async function maybeClaimHost(){
    if(!room||!uid||claimingHost)return; const hostId=room.meta.hostId; if(hostId===uid)return;
    const players=room.players||{}, h=players[hostId], me=players[uid];
    if(!me?.name||me.online===false)return;
    const gone=!h?.name||(h.online===false&&Date.now()-(h.lastSeen||0)>HOST_GRACE_MS+10000);
    if(!gone)return;
    const next=Object.entries(players).filter(([id,p])=>p?.name&&p.online!==false&&id!==hostId).sort((a,b)=>((a[1].joinedAt||0)-(b[1].joinedAt||0))||a[0].localeCompare(b[0]))[0];
    if(next?.[0]!==uid)return;
    claimingHost=true; try{ await update(ref(db,`rooms/${roomCode}/meta`),{hostId:uid,hostName:me.name}); await addActivity('act.nowHost',{name:me.name}) }catch{} finally{claimingHost=false}
  }

  // ---- Phones: ☰ menu and bottom tabs ----
  const menuBtn = $('menuBtn'), topActions = $('topActions');
  function setMenu(open){ topActions.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', String(open)); menuBtn.textContent = open ? '✕' : '☰' }
  menuBtn.addEventListener('click', e => { e.stopPropagation(); setMenu(!topActions.classList.contains('open')) });
  topActions.addEventListener('click', e => { if (e.target.closest('button,a')) setMenu(false) });
  document.addEventListener('click', e => { if (topActions.classList.contains('open') && !topActions.contains(e.target)) setMenu(false) });
  $('printMenu').addEventListener('click', () => print());
  function setTab(tab){ document.body.dataset.tab = tab; document.querySelectorAll('#tabbar [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab)); if (tab === 'activity') $('actBadge').classList.remove('show'); window.scrollTo({ top: 0 }) }
  document.querySelectorAll('#tabbar [data-tab]').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  setTab('card');

  // ---- Start ----
  populateSelects(); els.playerName.value=localStorage.getItem('bingoName')||''; loadSolo(); applyI18n();
  els.soundBtn.addEventListener('click',toggleSound); els.bossBtn.addEventListener('click',()=>toggleBoss(true)); els.boss.addEventListener('click',()=>toggleBoss(false));
  els.langBtn.addEventListener('click',openLangSettings); els.langDone.addEventListener('click',saveLangSettings); els.langModal.addEventListener('click',e=>{if(e.target===els.langModal)saveLangSettings()});
  els.topic.addEventListener('change',freshSolo); els.newCard.addEventListener('click',()=>room?hostNewGame():freshSolo()); els.resetMarks.addEventListener('click',()=>room?hostReset():resetSoloMarks()); els.print.addEventListener('click',()=>print());
  // Hero: solo jumps to the card, team opens the room controls (on phones via the bottom tabs).
  const phone=()=>matchMedia('(max-width:860px)').matches;
  $('heroSolo').addEventListener('click',()=>{ if(room) return; showTab(false); if(phone()) setTab('card'); els.board.scrollIntoView({behavior:'smooth',block:'center'}) });
  $('heroTeam').addEventListener('click',()=>{ showTab(true); if(phone()) setTab('play'); else els.multiTab.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(()=>els.playerName.focus(),300) });
  { const m=new Date().getMonth(); $('heroAdvent').classList.toggle('hidden', !(m===10||m===11||m===0)); }
  // Language changed on the Advent page (other tab, or this page restored with the back button): follow it.
  const syncSiteLang=()=>{ const s=pickLang(localStorage.getItem('bingoSiteLang'))||siteLang, p=localStorage.getItem('bingoCardLang')||'auto'; if(s===siteLang&&p===cardPref) return; const before=soloCardLang(); siteLang=s; cardPref=p; applyI18n(); if(!room&&soloCardLang()!==before) freshSolo(); };
  addEventListener('storage',e=>{ if(e.key==='bingoSiteLang'||e.key==='bingoCardLang') syncSiteLang() }); addEventListener('pageshow',syncSiteLang); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncSiteLang() });
  if(canFullscreen()){ $('fsBtn').classList.remove('hidden'); $('fsBtn').addEventListener('click',()=>toggleFullscreen()); }
  els.soloTab.addEventListener('click',()=>showTab(false)); els.multiTab.addEventListener('click',()=>showTab(true)); els.startSolo.addEventListener('click',freshSolo);
  els.openCreate.addEventListener('click',async()=>{if(await requireFirebase()){els.createTopic.value=els.topic.value;els.createLang.value=soloCardLang();els.createModal.classList.add('show')}}); els.cancelCreate.addEventListener('click',()=>els.createModal.classList.remove('show')); els.createModal.addEventListener('click',e=>{if(e.target===els.createModal)els.createModal.classList.remove('show')}); els.createRoom.addEventListener('click',createRoom);
  els.joinCode.addEventListener('input',e=>e.target.value=cleanCode(e.target.value)); els.joinRoom.addEventListener('click',()=>joinRoom()); els.leaveRoom.addEventListener('click',openLeave); els.endRoom.addEventListener('click',openEndRoom); els.hostModal.addEventListener('click',e=>{if(e.target===els.hostModal)closeModal()});
  els.copyInvite.addEventListener('click',async()=>{const u=new URL(location.href);u.searchParams.set('room',roomCode);await navigator.clipboard.writeText(u.href);setStatus('st.inviteCopied','success')});

  if(configured){ initFirebase().then(async ok=>{if(!ok)return;const q=new URLSearchParams(location.search).get('room');if(q){showTab(true);els.joinCode.value=cleanCode(q);setStatus('st.invite','',{code:cleanCode(q)});setTab('play')}}) } else { els.firebaseNotice.classList.remove('hidden') }
</script>
</body>
</html>
