name: Check languages and calendars

on:
  pull_request:
    paths: ['languages/**', 'advent/**', 'scripts/**']
  push:
    branches: [main]
    paths: ['languages/**', 'advent/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-languages.mjs
      - run: node scripts/check-advent.mjs
