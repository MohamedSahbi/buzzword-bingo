name: Add a language (AI agent)

# Two triggers:
#  - Run it from the Actions tab with a language code and name.
#  - Or: someone opens a "Add a language" issue; the maintainer approves it by adding the
#    "add-language" label. Only people with triage access can add labels, so the agent
#    never runs on a stranger's request alone.
# The agent writes languages/<code>.js with Gemini (free tier), validates it and opens a pull
# request. Nothing goes live until a human merges that pull request.
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'ISO 639-1 language code, e.g. pl'
        required: true
      name:
        description: 'Language name in English, e.g. Polish'
        required: true
      notes:
        description: 'Optional notes for the AI (audience, region, e.g. "Brazilian Portuguese")'
        required: false
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: add-language
  cancel-in-progress: false

jobs:
  add-language:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'add-language'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read the request
        id: req
        env:
          IN_CODE: ${{ inputs.code }}
          IN_NAME: ${{ inputs.name }}
          IN_NOTES: ${{ inputs.notes }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node -e '
            const field = (body, label) => {
              const m = (body || "").match(new RegExp("### " + label + "\\s*\\n+([^\\n#][^\\n]*)", "i"));
              return m && !/_No response_/.test(m[1]) ? m[1].trim() : "";
            };
            const b = process.env.ISSUE_BODY;
            const code = (process.env.IN_CODE || field(b, "Language code")).toLowerCase().trim();
            const name = (process.env.IN_NAME || field(b, "Language name")).replace(/[^\p{L} ()-]/gu, "").trim();
            const notes = (process.env.IN_NOTES || field(b, "Notes for the AI")).replace(/[\r\n]+/g, " ").slice(0, 500);
            if (!/^[a-z]{2,3}$/.test(code)) { console.error("Invalid language code: " + code); process.exit(1); }
            if (!name) { console.error("Missing language name"); process.exit(1); }
            const fs = require("fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `code=${code}\nname=${name}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes<<EOF_NOTES\n${notes}\nEOF_NOTES\n`);
          '

      - name: Generate the language with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          CODE: ${{ steps.req.outputs.code }}
          NAME: ${{ steps.req.outputs.name }}
          NOTES: ${{ steps.req.outputs.notes }}
        run: node scripts/add-language.mjs "$CODE" "$NAME" "$NOTES"

      - name: Validate all languages
        run: node scripts/check-languages.mjs

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.req.outputs.code }}
          NAME: ${{ steps.req.outputs.name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          BRANCH="add-language/$CODE-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add languages/
          git commit -m "Add $NAME ($CODE) language"
          git push origin "$BRANCH"
          {
            echo "Adds **$NAME** (\`$CODE\`): website text and bingo phrases, generated by the add-language agent and validated by \`scripts/check-languages.mjs\`."
            echo
            echo "### Before merging, ask a native speaker to check"
            echo "- [ ] Interface text reads naturally (buttons, dialogs, messages)"
            echo "- [ ] Phrases are real things people in this culture say or know, not translations"
            echo "- [ ] Nothing offensive, vulgar, political or religiously insensitive"
            echo "- [ ] Christmas/Advent fit how this audience actually celebrates"
            echo "- [ ] Try it: open the preview, 🌐 → pick $NAME, play a card"
            echo
            echo "Edit \`languages/$CODE.js\` directly in this PR to fix anything. See docs/ADDING_A_LANGUAGE.md."
            if [ -n "$ISSUE" ]; then echo; echo "Closes #$ISSUE"; fi
          } > /tmp/pr-body.md
          PR_URL=$(gh pr create --title "Add $NAME ($CODE) language" --body-file /tmp/pr-body.md --base "${{ github.event.repository.default_branch }}" --head "$BRANCH")
          echo "Opened $PR_URL"
          if [ -n "$ISSUE" ]; then gh issue comment "$ISSUE" --body "The language agent opened $PR_URL for review."; fi

      - name: Report failure on the issue
        if: failure() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE" --body "The language agent could not finish. See the run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
