name: Clean up idle bingo rooms

on:
  schedule:
    - cron: '17 2 * * *' # every night at 02:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list the rooms that would be deleted'
        type: boolean
        default: true
      idle_hours:
        description: 'Delete rooms idle for more than this many hours'
        default: '24'

permissions:
  contents: read

concurrency:
  group: cleanup-rooms
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install firebase-admin
        run: npm install --no-save --no-audit --no-fund firebase-admin@13
      - name: Delete idle rooms
        run: node scripts/cleanup-rooms.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DATABASE_URL: https://buzzword-bingo-6eb48-default-rtdb.europe-west1.firebasedatabase.app
          IDLE_HOURS: ${{ inputs.idle_hours || '24' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
